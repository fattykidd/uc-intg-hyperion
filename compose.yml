# Docker Compose for development with the UC Core Simulator
name: integration-hyperion

services:
  # Unfolded Circle Core Simulator for testing
  core-simulator:
    image: unfoldedcircle/core-simulator
    restart: "unless-stopped"
    hostname: core-simulator
    environment:
      - UC_INTEGRATION_DISABLE_CERT_VERIFICATION=true
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - simulator-data:/data

  intg-hyperion:
     build:
       context: .
       dockerfile: Dockerfile
     working_dir: /app/uc-intg-hyperion
     hostname: hyperion
     # nodemon watches for file changes and auto-restarts
     command: python3 -u intg-hyperion/driver.py
     volumes:
       - ../:/app

volumes:
  simulator-data:
